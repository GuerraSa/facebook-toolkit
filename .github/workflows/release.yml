# Pushing a tag like v1.2.3 creates a GitHub release with the script attached.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches @version
        run: grep -q "@version *${GITHUB_REF_NAME#v}$" facebook-toolkit.user.js || { echo "Tag $GITHUB_REF_NAME does not match @version in the script"; exit 1; }
      - name: Self-test
        run: node test.js
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" facebook-toolkit.user.js --title "$GITHUB_REF_NAME" --generate-notes
